<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фестиваль Плюс — фестивали на карте России</title>
<style>
:root{--red:#e51b23;--ink:#101113;--cream:#f5eee3;--paper:rgba(250,244,235,.97);--line:rgba(18,18,18,.16)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101113;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
#app{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;background:#e8dfd2}
/* ---------- map ---------- */
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#viewport.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:transform 1s cubic-bezier(.2,.8,.18,1)}
#stage.nodelay{transition:none}
#art{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.shade{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(90deg,rgba(248,241,230,.92) 0%,rgba(248,241,230,.7) 14%,rgba(248,241,230,.28) 26%,transparent 40%),linear-gradient(180deg,rgba(248,241,230,.5),transparent 16%),linear-gradient(0deg,rgba(20,25,28,.22),transparent 24%)}
/* ---------- markers ---------- */
.city{position:absolute;width:30px;height:30px;margin:0;padding:0;border:0;background:transparent;translate:-50% -50%;scale:var(--inv,1);z-index:3;transition:scale 1s cubic-bezier(.2,.8,.18,1)}
#stage.nodelay .city{transition:none}
.city .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;translate:-50% -50%;border:2px solid #fff;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(229,27,35,.25),0 0 18px 7px rgba(229,27,35,.7);transition:box-shadow .25s,width .25s,height .25s}
.city:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;translate:-50% -50%;border:1px solid rgba(229,27,35,.9);border-radius:50%;animation:ring 2.8s infinite;pointer-events:none}
.city .label{position:absolute;left:30px;top:50%;translate:0 -50%;display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(15,17,18,.8);color:#fff;padding:5px 11px;border-radius:14px;font-size:12px;letter-spacing:.2px;backdrop-filter:blur(5px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.city .label b{display:grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--red);font-size:10px;padding:0 4px}
.city:hover .dot,.city:focus-visible .dot,.city.selected .dot{width:18px;height:18px;box-shadow:0 0 0 8px rgba(229,27,35,.22),0 0 28px 12px rgba(229,27,35,.9)}
.city:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:50%}
.city.selected{z-index:5}
.city.selected .label{background:var(--red)}
.city.dim{opacity:.55}
/* ---------- header ---------- */
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;height:94px;display:flex;align-items:center;gap:36px;padding:0 3.6%;background:linear-gradient(180deg,rgba(249,243,234,.96),rgba(249,243,234,.7),transparent)}
.brand{display:flex;align-items:center;gap:13px;min-width:230px;border:0;background:none;padding:0;text-align:left;font-family:'Arial Narrow','Roboto Condensed',Arial,sans-serif;font-weight:700;font-stretch:condensed;line-height:1.02;font-size:22px;letter-spacing:.3px;text-transform:uppercase}
.brand{text-decoration:none;color:inherit}.brand img{width:60px;height:auto;flex:none;display:block}
.nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.6vw,44px);flex:1;font-size:11px;letter-spacing:1.2px;white-space:nowrap}
.nav button,.nav a{position:relative;border:0;background:none;padding:8px 2px;text-transform:uppercase;letter-spacing:1.2px;font-size:11px;color:#222}
.nav a{text-decoration:none;display:inline-block}.nav button:hover,.nav a:hover{color:var(--red)}
.nav .active{font-weight:700}
.nav .active:after{content:"";position:absolute;height:2px;background:var(--red);left:0;right:0;bottom:-4px}
.lang{display:flex;gap:6px;font-size:12px}
.lang button{border:0;background:none;padding:4px 6px;border-bottom:1px solid transparent;color:#555}
.lang button.on{color:#111;font-weight:700;border-bottom-color:var(--red)}
.apply{text-decoration:none;color:inherit;border:1px solid var(--red);border-radius:24px;padding:13px 20px;background:rgba(255,255,255,.35);font-size:11px;letter-spacing:.8px;white-space:nowrap;text-transform:uppercase;transition:background .2s,color .2s}
.apply:hover{background:var(--red);color:#fff}
/* ---------- left panel ---------- */
.leftpanel{position:absolute;z-index:6;left:3.8%;top:74px;bottom:78px;width:268px;max-width:30vw;display:flex;flex-direction:column;animation:rise .8s .1s both}
.eyebrow{font-size:10px;color:var(--red);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.eyebrow:before{content:"";width:32px;height:2px;background:var(--red)}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(30px,min(3.3vw,5.4vh),52px);line-height:.96;letter-spacing:-1.5px;margin:0 0 16px;text-transform:uppercase}
.intro{font-size:13px;line-height:1.5;max-width:230px;margin:0 0 18px;color:#272727}
.flist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:2px 8px 8px 0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent;}
.fitem{border:0;background:transparent;padding:4px 8px 4px 0;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:11.5px;line-height:1.3;color:#333;letter-spacing:.2px;border-radius:6px}
.fitem:before{content:"";width:9px;height:9px;border:1px solid #777;border-radius:50%;margin-top:3px;flex:none}
.fitem:hover{color:var(--red)}
.fitem.active{color:var(--red);font-weight:700}
.fitem.active:before{background:var(--red);border-color:var(--red)}
.fitem small{display:block;font-size:10px;color:#6c6c6c;font-weight:400;margin-top:1px;letter-spacing:0}
.fitem.past{opacity:.62}
.fitem .t{text-transform:uppercase}
.bottomleft{position:absolute;z-index:6;left:3.8%;bottom:28px;font-size:12px;letter-spacing:1.4px;line-height:1.5;text-transform:uppercase;color:#222}
.soc{display:flex;gap:12px;margin-bottom:10px}.soc a{font-size:10px;letter-spacing:1.2px;color:#222;text-decoration:none;border-bottom:1px solid var(--red)}.soc a:hover{color:var(--red)}
.bottomleft small{display:block;font-size:9.5px;letter-spacing:1.2px;color:#666}
/* ---------- controls ---------- */
.controls{position:absolute;z-index:6;right:3.6%;bottom:90px;display:flex;align-items:center;gap:12px}
.compass{width:60px;height:60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(10,12,14,.35);color:#fff;font-size:22px;backdrop-filter:blur(6px);display:grid;place-items:center;position:relative}
.compass:before{content:"N";position:absolute;top:5px;font-size:8px;color:var(--red);font-weight:700}
.zooms{display:flex;flex-direction:column;gap:6px}
.zoom{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(10,12,14,.35);color:#fff;font-size:17px;line-height:1;backdrop-filter:blur(6px)}
.compass:hover,.zoom:hover{background:var(--red)}
.hint{position:absolute;z-index:6;right:3.6%;bottom:28px;display:flex;gap:12px;align-items:center;font-size:9.5px;letter-spacing:1.3px;color:#fff;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
/* ---------- popup ---------- */
.popup{position:absolute;z-index:9;width:min(380px,calc(100vw - 24px));background:var(--paper);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 48px rgba(14,18,20,.28);border-radius:12px;padding:12px;opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(16px)}
.popup.show{opacity:1;transform:none;pointer-events:auto}
.pgrid{display:grid;grid-template-columns:120px 1fr;gap:16px}
.poster{position:relative;width:120px;height:152px;border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:Georgia,serif;font-size:11px;line-height:1.05;letter-spacing:.3px;text-transform:uppercase;overflow:hidden;overflow-wrap:anywhere}
.poster .plogo{position:absolute;left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;object-position:center;display:block}
.pinfo{padding:2px 24px 4px 0;min-width:0}
.p-kicker{font-size:9px;letter-spacing:1.3px;color:var(--red);text-transform:uppercase}
.popup h2{margin:5px 0 3px;font-family:Georgia,serif;font-weight:400;font-size:20px;line-height:1.05;letter-spacing:-.3px;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto}
.kind{font-size:12px;color:#333;margin-bottom:10px}
.meta{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:5px 0;color:#222}
.ico{color:var(--red);width:14px;text-align:center}
.badge{display:inline-block;margin-top:6px;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.07);color:#444}
.badge.up{background:rgba(229,27,35,.12);color:var(--red)}
.pdesc{grid-column:1/-1;font-size:11.5px;line-height:1.45;color:#333;margin:2px 2px 0}
.pact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pbtn{display:inline-block;border:1px solid var(--red);border-radius:18px;background:transparent;padding:8px 13px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;text-decoration:none;color:var(--red)}
.pbtn.fill{background:var(--red);color:#fff}.pbtn:hover{filter:brightness(.92);background:var(--red);color:#fff}
.close{position:absolute;top:8px;right:10px;width:28px;height:28px;border:0;background:transparent;font-size:22px;line-height:1;color:#222;border-radius:50%}
.close:hover{background:rgba(0,0,0,.08)}
.more{position:absolute;right:12px;bottom:58px;width:34px;height:34px;border-radius:50%;border:1.5px solid #111;background:transparent;font-size:16px;display:grid;place-items:center}
.more:hover{background:#111;color:#fff}
.back{border:0;background:none;padding:0 0 8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--red);grid-column:1/-1;text-align:left;justify-self:start}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.crow{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.55);padding:9px 12px;text-align:left}
.crow:hover{border-color:var(--red);background:#fff}
.crow .n{flex:1;min-width:0}
.crow b{display:block;font-size:12.5px;letter-spacing:.2px;text-transform:uppercase;overflow-wrap:anywhere}
.crow small{display:block;font-size:11px;color:#666;margin-top:2px}
.crow i{font-style:normal;color:var(--red);font-size:16px}
.chead{padding-right:30px}
.chead .p-kicker{margin-bottom:4px}
.chead h2{margin:0}
/* ---------- sheets ---------- */
.sheet{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(16,17,19,.55);backdrop-filter:blur(6px)}
.sheet.show{display:flex;animation:fade .25s both}
.panel{position:relative;width:min(980px,100%);max-height:min(86svh,820px);overflow:auto;background:var(--paper);border-radius:16px;padding:38px 42px 34px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.panel.narrow{width:min(620px,100%)}
.panel h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(28px,3.2vw,42px);line-height:1;letter-spacing:-1px;text-transform:uppercase;margin:0 0 8px;padding-right:40px}
.panel .lead{font-size:14px;line-height:1.55;color:#333;max-width:620px;margin:0 0 22px}
.panel .close{top:16px;right:18px;font-size:28px;width:38px;height:38px}
.month{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.month:after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.6);padding:10px;text-align:left;width:100%}
.card:hover{border-color:var(--red);background:#fff}
.card .poster{width:68px;height:86px;font-size:9px;padding:5px;flex:none}
.card .ci{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.card b{font-size:13px;text-transform:uppercase;letter-spacing:.2px;overflow-wrap:anywhere}
.card span{font-size:11.5px;color:#555}
.card .st{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--red)}
.card .st.past{color:#777}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin:6px 0 22px}
.stats div{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#555}
.stats b{display:block;font-family:Georgia,serif;font-weight:400;font-size:44px;line-height:1;color:var(--ink);letter-spacing:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:12px;text-decoration:none;background:rgba(255,255,255,.6)}
a.chip:hover{border-color:var(--red);color:var(--red)}
.crow2{display:grid;grid-template-columns:130px 1fr;gap:6px 18px;font-size:14px;margin:0 0 16px}
.crow2 dt{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#777;padding-top:3px}
.crow2 dd{margin:0}
.news{display:flex;flex-direction:column;gap:10px}
.nitem{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;border-top:1px solid var(--line);padding:14px 0}
.nitem time{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--red)}
.nitem b{display:block;font-size:14px;margin-bottom:2px}
.nitem span{font-size:12.5px;color:#555}
.empty{font-size:13px;color:#666;border:1px dashed var(--line);border-radius:10px;padding:16px}
form label{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#666;margin:14px 0 5px}
form input,form select,form textarea{width:100%;border:1px solid rgba(0,0,0,.25);border-radius:8px;background:#fff;padding:11px 12px;font:inherit;font-size:14px}
form input:focus,form select:focus,form textarea:focus{outline:2px solid rgba(229,27,35,.45);border-color:var(--red)}
form textarea{min-height:96px;resize:vertical}
form .pbtn{margin-top:20px;padding:12px 22px;font-size:11px}
.note{font-size:11px;color:#777;margin-top:10px;line-height:1.4}
.toast{position:absolute;z-index:40;left:50%;bottom:30px;translate:-50% 0;background:#111;color:#fff;padding:11px 18px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
@keyframes ring{0%{scale:.65;opacity:.8}75%,100%{scale:1.7;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:960px){.intro{display:none}.eyebrow{margin-bottom:10px}h1{margin-bottom:12px}.leftpanel{top:64px;bottom:64px}.fitem{font-size:11px}}
@media(max-height:780px){.fitem small{display:none}}
@media(max-width:1100px){.nav{gap:14px}.topbar{gap:18px}.brand{min-width:0;font-size:18px}}
@media(max-width:900px){.hint{display:none}.nitem{grid-template-columns:1fr}.crow2{grid-template-columns:1fr}}
@media(max-width:760px){
  .topbar{height:auto;flex-wrap:wrap;gap:6px 10px;padding:10px 14px 6px}
  .brand{font-size:15px;gap:8px}.brand img{width:44px}
  .nav{order:5;flex:0 0 100%;justify-content:flex-start;overflow-x:auto;gap:16px;padding-bottom:2px;scrollbar-width:none}
  .lang{margin-left:auto}.apply{padding:8px 12px;font-size:10px}
  .leftpanel{left:14px;top:20px;width:calc(100% - 28px);max-width:none;bottom:auto}
  h1{font-size:30px;margin-bottom:8px}.intro{display:none}.eyebrow{margin-bottom:8px}
  .flist{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:14px;padding:4px 0;-webkit-mask-image:none;max-width:100%}
  .fitem{flex:none;min-width:max-content}
  .controls{bottom:86px;right:14px}.compass{width:46px;height:46px}
  .bottomleft{left:14px;bottom:20px}
  .popup{left:10px!important;right:10px;top:auto!important;bottom:12px;width:auto}
  .panel{padding:28px 20px 24px}
}
</style>
</head>

const vp=$("viewport"), stage=$("stage"), citiesEl=$("cities"), popup=$("popup"), sheet=$("sheet"), panel=$("panel"), appEl=$("app");
let lang="ru", selFest=null, selCity=null, mode=null, navActive="calendar", popTimer=null;
let VW=0,VH=0,W=0,H=0, cam={k:1,x:0,y:0};
const mobile=()=>window.innerWidth<=760;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=()=>T[lang];
const cityName=k=>CITIES[k][lang];
const fTitle=f=>f[lang], fKind=f=>lang==="ru"?f.kindRu:f.kindEn;
const plural=(n,a)=>{const m=n%10,h=n%100;return lang==="en"?(n===1?a[0]:a[1]):(m===1&&h!==11?a[0]:(m>=2&&m<=4&&(h<10||h>=20)?a[1]:a[2]));};
const byDate=(a,b)=>(a.s||"9999").localeCompare(b.s||"9999");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const status=f=>!f.s?"pending":(f.e<today()?"past":"up");
function fmtDate(f){
  if(!f.s) return t().tbd;
  const [y1,m1,d1]=f.s.split("-").map(Number),[y2,m2,d2]=f.e.split("-").map(Number),M=t().months;
  if(lang==="ru") return m1===m2?`${d1}–${d2} ${M[m1-1]} ${y1}`:`${d1} ${M[m1-1]} – ${d2} ${M[m2-1]} ${y2}`;
  return m1===m2?`${M[m1-1]} ${d1}–${d2}, ${y1}`:`${M[m1-1]} ${d1} – ${M[m2-1]} ${d2}, ${y2}`;
}
function posterBg(f){
  if(f.id==="nasledie") return "radial-gradient(circle at 60% 25%,#c7b8a9,transparent 30%),linear-gradient(145deg,#111,#393c3e 50%,#8e8175)";
  if(f.id==="ozhivi") return "radial-gradient(circle at 65% 25%,#743c83,transparent 30%),linear-gradient(150deg,#091a2b,#132d45 45%,#d63d46)";
  let h=0;for(const c of f.id)h=(h*31+c.charCodeAt(0))%360;
  return `radial-gradient(circle at 70% 22%,hsla(${h},70%,62%,.9),transparent 34%),linear-gradient(150deg,#14171b,hsl(${(h+20)%360},38%,24%) 55%,hsl(${h},55%,42%))`;
}
const posterStyle=f=>f.logo?`background:#fff;box-shadow:inset 0 0 0 1px rgba(20,20,20,.09),0 2px 8px rgba(0,0,0,.05)`:`background:${posterBg(f)}`;
const posterImg=f=>f.logo?`<img class="plogo" src="${esc(f.logo)}" alt="" loading="lazy">`:"";
const posterText=f=>f.logo?"":esc(fTitle(f).split(/\s+/).slice(0,2).join(" "));
const festsOf=k=>FESTIVALS.filter(f=>f.city===k).sort(byDate);
const cityKeys=()=>Object.keys(CITIES);
/* ============ КАМЕРА ============ */
function layout(){
  VW=vp.clientWidth; VH=vp.clientHeight;
  const base=Math.max(VW/IW,VH/IH); W=IW*base; H=IH*base;
  stage.style.width=W+"px"; stage.style.height=H+"px";
  placeMarkers();
}
function clampCam(){cam.k=clamp(cam.k,1,3.2);cam.x=clamp(cam.x,VW-cam.k*W,0);cam.y=clamp(cam.y,VH-cam.k*H,0);}
function home(){cam={k:1,x:(VW-W)/2,y:(VH-H)/2};}
function applyCam(animate){
  stage.classList.toggle("nodelay",!animate);
  stage.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
  stage.style.setProperty("--inv",1/cam.k);
}
const toScreen=k=>({x:cam.x+cam.k*W*CITIES[k].x/IW, y:cam.y+cam.k*H*CITIES[k].y/IH});
function focusCity(k){
  cam.k=mobile()?1.5:1.6;
  const tx=VW*(mobile()?.5:.62), ty=VH*(mobile()?.3:.48);
  cam.x=tx-cam.k*W*CITIES[k].x/IW; cam.y=ty-cam.k*H*CITIES[k].y/IH;
  clampCam(); applyCam(true);
}
function zoomAt(f,cx,cy,animate){
  const nk=clamp(cam.k*f,1,3.2), r=nk/cam.k;
  cam.x=cx-(cx-cam.x)*r; cam.y=cy-(cy-cam.y)*r; cam.k=nk; clampCam(); applyCam(animate);
}
/* ============ МАРКЕРЫ ============ */
function placeMarkers(){ citiesEl.querySelectorAll(".city").forEach(b=>{const c=CITIES[b.dataset.city];b.style.left=(c.x/IW*100)+"%";b.style.top=(c.y/IH*100)+"%";}); }
function renderMarkers(){
  citiesEl.replaceChildren();
  cityKeys().forEach(k=>{
    const n=festsOf(k).length, b=document.createElement("button");
    b.type="button"; b.className="city"+(selCity===k?" selected":"")+(selCity&&selCity!==k?" dim":""); b.dataset.city=k;
    b.setAttribute("aria-label",`${cityName(k)}: ${n} ${plural(n,t().cntF)}`);
    b.innerHTML=`<span class="dot"></span><span class="label">${esc(cityName(k))}<b>${n}</b></span>`;
    b.addEventListener("click",e=>{e.stopPropagation();selectCity(k);});
    citiesEl.appendChild(b);
  });
  placeMarkers();
}
/* ============ ЛЕВАЯ ПАНЕЛЬ ============ */
function renderStatic(){
  document.documentElement.lang=lang;
  const nav=$("nav"); if(nav) nav.innerHTML=["home","calendar","about","gallery","contacts"].map(k=>k==="calendar"?`<button type="button" data-nav="calendar" class="active">${esc(t().nav[k])}</button>`:`<a href="${PAGES[k]}" target="_top">${esc(t().nav[k])}</a>`).join("");
  const applyBtn=$("applyBtn"); if(applyBtn){applyBtn.href=PAGES.apply;applyBtn.textContent=t().apply;}
  $("eyebrow").textContent=t().eyebrow; $("h1").innerHTML=t().h1; $("intro").textContent=t().intro;
  $("hint").innerHTML=t().hint.map(s=>`<span>${esc(s)}</span>`).join("");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const homeBtn=$("home"); if(homeBtn) homeBtn.setAttribute("aria-label","Фестиваль Плюс");
  const nF=FESTIVALS.length,nC=cityKeys().length;
  $("bottomleft").innerHTML=`<div class="soc">${SOCIALS.map(s=>`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a>`).join("")}</div>${esc(t().russia)}<small>${nF} ${plural(nF,t().cntF)} · ${nC} ${plural(nC,t().cntC)}</small>`;
}
function renderList(){
  const items=[`<button type="button" class="fitem ${!selFest&&!selCity?"active":""}" data-all="1"><span><span class="t">${esc(t().all)}</span></span></button>`];
  FESTIVALS.slice().sort(byDate).forEach(f=>{
    items.push(`<button type="button" class="fitem ${selFest===f.id?"active":""} ${status(f)==="past"?"past":""}" data-f="${f.id}"><span><span class="t">${esc(fTitle(f))}</span><small>${esc(cityName(f.city))} · ${esc(fmtDate(f))}</small></span></button>`);
  });
  const el=$("flist"); el.innerHTML=items.join("");
  const a=el.querySelector(".fitem.active"); if(a&&selFest) a.scrollIntoView({block:"nearest"});
}
/* ============ ПОПАП ============ */
function popupHTML(){
  if(mode==="city"){
    const list=festsOf(selCity);
    return `<button class="close" data-close="1" aria-label="×">×</button>
    <div class="chead"><div class="p-kicker">${esc(t().city)} · ${list.length} ${plural(list.length,t().cntF)}</div><h2 id="popupTitle">${esc(cityName(selCity))}</h2></div>
    <div class="clist">${list.map(f=>`<button type="button" class="crow" data-f="${f.id}"><span class="n"><b>${esc(fTitle(f))}</b><small>${esc(fmtDate(f))}</small></span><i>→</i></button>`).join("")}</div>`;
  }
  const f=FESTIVALS.find(x=>x.id===selFest), st=status(f);
    const desc=lang==="ru"?f.descRu:f.descEn;
  return `<button class="close" data-close="1" aria-label="×">×</button>
  <div class="pgrid">
    <button class="back" type="button" data-back="1">${esc(t().back)}</button>
    <div class="poster" style="${posterStyle(f)}" aria-hidden="true">${posterImg(f)}${posterText(f)}</div>
    <div class="pinfo"><div class="p-kicker">${esc(t().kicker)}</div><h2 id="popupTitle">${esc(fTitle(f))}</h2><div class="kind">${esc(fKind(f))}</div>
      <div class="meta"><span class="ico">⌖</span><span>${esc(cityName(f.city))}</span></div>
      <div class="meta"><span class="ico">▢</span><span>${esc(fmtDate(f))}</span></div>
      <span class="badge ${st==="up"?"up":""}">${esc(t().st[st])}</span></div>
    ${desc?`<p class="pdesc">${esc(desc)}</p>`:""}
    <div class="pact"><a class="pbtn fill" href="${PAGES.apply}" target="_top">${esc(t().apply2)}</a></div>
  </div>`;
}
function showPopup(){
  clearTimeout(popTimer); popup.classList.remove("show");
  if(!mode) return;
  popTimer=setTimeout(()=>{ popup.innerHTML=popupHTML(); placePopup(); popup.classList.add("show"); }, matchMedia("(prefers-reduced-motion:reduce)").matches?0:(popup.dataset.fast?0:650));
}
function placePopup(){
  if(mobile()||!selCity) return;
  const p=toScreen(selCity), w=popup.offsetWidth, h=popup.offsetHeight;
  const lab=citiesEl.querySelector('.city.selected .label'), lw=lab?lab.getBoundingClientRect().width:60;
  let x=p.x+30+lw+14; if(x+w>VW-16) x=p.x-30-lw-14-w; x=clamp(x,12,VW-w-12);
  const y=clamp(p.y-h/2,20,Math.max(20,VH-h-16));
  popup.style.left=x+"px"; popup.style.top=y+"px";
}
function hidePopup(){clearTimeout(popTimer);popup.classList.remove("show");}
/* ============ ВЫБОР ============ */
function selectFestival(id,fromCity){
  const f=FESTIVALS.find(x=>x.id===id); if(!f) return;
  const sameCity=selCity===f.city;
  selFest=id; selCity=f.city; mode="fest";
  renderMarkers(); renderList();
  if(sameCity&&popup.classList.contains("show")){ popup.innerHTML=popupHTML(); placePopup(); return; }
  focusCity(f.city); popup.dataset.fast=""; showPopup();
}
function selectCity(k){
  const list=festsOf(k);
  if(list.length===1){ selectFestival(list[0].id); return; }
  selCity=k; selFest=null; mode="city"; renderMarkers(); renderList();
  focusCity(k); showPopup();
}
function resetAll(){
  selFest=null; selCity=null; mode=null; hidePopup(); home(); applyCam(true); renderMarkers(); renderList();
}
function closePopup(){ selFest=null; selCity=null; mode=null; hidePopup(); renderMarkers(); renderList(); }
/* ============ ЛИСТЫ (разделы) ============ */
function setNav(k){navActive=k;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===k));}
function closeSheet(){ sheet.classList.remove("show"); setNav("calendar"); }
function openSheet(kind,arg){
  hidePopup();
  const x=t(); let h="", narrow=false;
  const closeBtn=`<button class="close" data-sheetclose="1" aria-label="×">×</button>`;
  if(kind==="festivals"){
    const sorted=FESTIVALS.slice().sort(byDate); let cur="", out="";
    sorted.forEach(f=>{
      const g=f.s?`${x.monthsN[+f.s.slice(5,7)-1]} ${f.s.slice(0,4)}`:x.tbdGroup;
      if(g!==cur){ if(cur) out+="</div>"; out+=`<div class="month">${esc(g)}</div><div class="cards">`; cur=g; }
      const st=status(f);
      out+=`<button type="button" class="card" data-pick="${f.id}"><div class="poster" style="${posterStyle(f)}" aria-hidden="true">${posterImg(f)}${posterText(f)}</div><div class="ci"><span class="st ${st==="past"?"past":""}">${esc(x.st[st])}</span><b>${esc(fTitle(f))}</b><span>${esc(cityName(f.city))}</span><span>${esc(fmtDate(f))}</span></div></button>`;
    });
    h=`${closeBtn}<h2>${esc(x.festTitle)}</h2><p class="lead">${esc(x.festLead)}</p>${out}</div>`;
  } else if(kind==="about"){
    const up=FESTIVALS.filter(f=>status(f)==="up").length;
    h=`${closeBtn}<h2>${esc(x.aboutTitle)}</h2><p class="lead">${esc(x.aboutLead)}</p>
    <div class="stats"><div><b>${FESTIVALS.length}</b>${esc(x.sF)}</div><div><b>${cityKeys().length}</b>${esc(x.sC)}</div><div><b>${up}</b>${esc(x.sU)}</div></div>
    <div class="month">${esc(x.cities)}</div><div class="chips">${cityKeys().map(k=>`<button type="button" class="chip" data-pickcity="${k}">${esc(cityName(k))}</button>`).join("")}</div>`;
  } else if(kind==="partners"){
    narrow=!PARTNERS.length;
    h=`${closeBtn}<h2>${esc(x.partTitle)}</h2><p class="lead">${esc(x.partLead)}</p>
    ${PARTNERS.length?`<div class="chips">${PARTNERS.map(p=>p.url?`<a class="chip" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>`:`<span class="chip">${esc(p.name)}</span>`).join("")}</div><br>`:""}
    <a class="pbtn fill" href="mailto:${MAIL}?subject=${encodeURIComponent(x.partTitle)}">${esc(x.partBtn)}</a>`;
  } else if(kind==="news"){
    const items=[];
    NEWS.forEach(n=>items.push({d:n.date,title:lang==="ru"?n.ru:n.en,text:lang==="ru"?(n.textRu||""):(n.textEn||"")}));
    FESTIVALS.filter(f=>status(f)!=="past").sort(byDate).forEach(f=>items.push({d:f.s,title:`${x.anons}: ${fTitle(f)}`,text:`${cityName(f.city)} · ${fKind(f)}`,f:f.id,dt:fmtDate(f)}));
    h=`${closeBtn}<h2>${esc(x.newsTitle)}</h2><p class="lead">${esc(x.newsLead)}</p><div class="news">${items.map(i=>`<div class="nitem"><time>${esc(i.dt||i.d||x.soon)}</time><div><b>${esc(i.title)}</b><span>${esc(i.text)}</span></div>${i.f?`<button type="button" class="pbtn" data-pick="${i.f}">${esc(x.onMap)}</button>`:"<span></span>"}</div>`).join("")}</div>`;
  } else if(kind==="contacts"){
    narrow=true;
    h=`${closeBtn}<h2>${esc(x.contTitle)}</h2><p class="lead">${esc(x.contLead)}</p>
    <dl class="crow2"><dt>${esc(x.cPhone)}</dt><dd><a href="tel:${PHONE_TEL}">${PHONE}</a></dd><dt>${esc(x.cMail)}</dt><dd><a href="mailto:${MAIL}">${MAIL}</a></dd>
    <dt>${esc(x.cSoc)}</dt><dd><div class="chips" style="margin:0">${SOCIALS.map(s=>s.u?`<a class="chip" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a>`:`<span class="chip">${esc(s.n)}</span>`).join("")}</div></dd></dl>
    <button type="button" class="pbtn fill" data-apply="">${esc(x.apply2)}</button>`;
  } else if(kind==="apply"){
    narrow=true;
    h=`${closeBtn}<h2>${esc(x.appTitle)}</h2><p class="lead">${esc(x.appLead)}</p>
    <form id="appForm"><label for="fName">${esc(x.fName)}</label><input id="fName" required autocomplete="name">
    <label for="fMail">${esc(x.fMail)}</label><input id="fMail" type="email" required autocomplete="email">
    <label for="fFest">${esc(x.fFest)}</label><select id="fFest">${FESTIVALS.slice().sort(byDate).map(f=>`<option value="${f.id}" ${f.id===arg?"selected":""}>${esc(fTitle(f))} — ${esc(cityName(f.city))}</option>`).join("")}<option value="" ${arg===""||arg===undefined?"selected":""}>${esc(x.other)}</option></select>
    <label for="fMsg">${esc(x.fMsg)}</label><textarea id="fMsg"></textarea>
    <button class="pbtn fill" type="submit">${esc(x.send)}</button><p class="note">${esc(x.appNote)}</p></form>`;
  }
  panel.className="panel"+(narrow?" narrow":""); panel.innerHTML=h; panel.scrollTop=0; sheet.classList.add("show");
  if(kind!=="apply") setNav(kind);
  const first=panel.querySelector("input,.close"); if(first) first.focus({preventScroll:true});
}
/* ============ ДЕЙСТВИЯ ============ */
function toast(s){const el=$("toast");el.textContent=s;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600);}
function pickFromSheet(id){ closeSheet(); selectFestival(id); }
/* ============ СОБЫТИЯ ============ */
const navEl=$("nav"); if(navEl) navEl.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; closeSheet(); resetAll();
});
$("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.l===lang)return;lang=b.dataset.l;renderStatic();renderMarkers();renderList();
  if(mode){popup.innerHTML=popupHTML();placePopup();} });
$("flist").addEventListener("click",e=>{const b=e.target.closest(".fitem");if(!b)return; if(b.dataset.all) resetAll(); else selectFestival(b.dataset.f);});
popup.addEventListener("click",e=>{
  const t2=e.target.closest("[data-close],[data-f],[data-back],[data-apply]"); if(!t2) return;
  if(t2.dataset.close!==undefined) closePopup();
  else if(t2.dataset.f) selectFestival(t2.dataset.f);
  else if(t2.dataset.back!==undefined){ mode="city"; selFest=null; renderList(); popup.innerHTML=popupHTML(); placePopup(); }
  else if(t2.dataset.apply!==undefined) openSheet("apply",t2.dataset.apply);
});
sheet.addEventListener("click",e=>{
  if(e.target===sheet||e.target.closest("[data-sheetclose]")){closeSheet();return;}
  const p=e.target.closest("[data-pick]"); if(p){pickFromSheet(p.dataset.pick);return;}
  const c=e.target.closest("[data-pickcity]"); if(c){closeSheet();selectCity(c.dataset.pickcity);return;}
  const a=e.target.closest("[data-apply]"); if(a){openSheet("apply",a.dataset.apply);}
});
sheet.addEventListener("submit",e=>{
  e.preventDefault(); const f=FESTIVALS.find(x=>x.id===$("fFest").value);
  const subj=`${t().appTitle}${f?": "+f.ru:""}`;
  const body=`${t().fName}: ${$("fName").value}\n${t().fMail}: ${$("fMail").value}\n${t().fFest}: ${f?f.ru+" ("+CITIES[f.city].ru+")":t().other}\n\n${$("fMsg").value}`;
  toast(t().toastMail); location.href=`mailto:${MAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
});
$("reset").addEventListener("click",resetAll);
$("zoomIn").addEventListener("click",()=>zoomAt(1.3,VW/2,VH/2,true));
$("zoomOut").addEventListener("click",()=>{zoomAt(1/1.3,VW/2,VH/2,true);if(cam.k<=1.001){home();applyCam(true);}hidePopup();});
/* перетаскивание и колесо */
let drag=null,moved=false;
vp.addEventListener("pointerdown",e=>{ if(e.target.closest(".city"))return; drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false;vp.setPointerCapture(e.pointerId);});
vp.addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(!moved&&Math.hypot(dx,dy)<4)return; if(!moved){moved=true;vp.classList.add("dragging");hidePopup();}
  cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCam();applyCam(false);});
const endDrag=()=>{ if(!drag)return; const was=moved; drag=null; vp.classList.remove("dragging"); if(!was&&popup.classList.contains("show")) closePopup(); };
vp.addEventListener("pointerup",endDrag); vp.addEventListener("pointercancel",()=>{drag=null;vp.classList.remove("dragging");});
vp.addEventListener("wheel",e=>{e.preventDefault();hidePopup();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY,false);},{passive:false});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape")return; if(sheet.classList.contains("show"))closeSheet(); else if(mode)closePopup(); });
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout(); if(selCity){focusCity(selCity);if(mode){popup.innerHTML=popupHTML();placePopup();}} else {home();applyCam(false);} },80);});
/* старт */
renderStatic(); renderMarkers(); renderList(); layout(); home(); applyCam(false);
})();
</script>
</body>
</html>
