<script>
var W=(window.Telegram&&window.Telegram.WebApp)||window.TelegramWidget;
function at(p){if(!p)return;var els=[document.documentElement,document.body];
for(var i=0;i<els.length;i++){var r=els[i].style;
r.setProperty("--tg-theme-bg-color",p.bg_color||"#fff");
r.setProperty("--tg-theme-text-color",p.text_color||"#000");
r.setProperty("--tg-theme-hint-color",p.hint_color||"#707579");
r.setProperty("--tg-theme-link-color",p.link_color||"#3390ec");
r.setProperty("--tg-theme-button-color",p.button_color||"#3390ec");
r.setProperty("--tg-theme-button-text-color",p.button_text_color||"#fff");
r.setProperty("--tg-theme-secondary-bg-color",p.secondary_bg_color||"#f1f1f4");}}
at(W&&W.themeParams);
var F=[["vodoley","ВОДОЛЕЙ","Санкт-Петербург","2026-11-12","2026-11-13"],["scenarium","СЦЕНАРИУМ","Москва","2026-11-17","2026-11-18"],["nasledie","НАСЛЕДИЕ","Москва",null,null],["maykop","МАЙКОПСКИЙ ФИЛЬМ ФЕСТИВАЛЬ","Майкоп","2027-01-22","2027-01-24"],["zov","ZOV","Воткинск","2027-04-12","2027-04-14"],["whitenights","БЕЛЫЕ НОЧИ","Санкт-Петербург","2027-04-22","2027-04-24"],["bridges","МОСТЫ","Санкт-Петербург","2027-05-06","2027-05-08"],["sochi","СОЧИ ФИЛЬМ ФЕСТИВАЛЬ","Сочи","2027-06-18","2027-06-20"],["feodosia","ФЕОДОСИЙСКИЙ КИНО ФЕСТИВАЛЬ","Феодосия","2027-08-20","2027-08-22"],["vtk","ВТК СТАРТ ФЕСТ","Воткинск","2027-09-20","2027-09-22"],["ozhivi","ОЖИВИ!","Санкт-Петербург",null,null]];
var MO=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function td(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmt(s,e){if(!s||!e)return"даты уточн.";var a=s.split("-"),b=e.split("-");
return a[1]===b[1]?parseInt(a[2],10)+"–"+parseInt(b[2],10)+" "+MO[+a[1]-1]+" "+a[0]:parseInt(a[2],10)+" "+MO[+a[1]-1]+" – "+parseInt(b[2],10)+" "+MO[+b[1]-1]+" "+e.slice(0,4);}
function open(u){if(W&&W.openLink)W.openLink(u);else location.href=u;}
function rd(){var t=td();
document.getElementById("list").innerHTML=F.map(function(x){
var past=x[4]&&x[4]<t,up=x[3]&&x[3]<=t&&x[4]>=t;
var dt=past?"состоялся":up?"идёт сейчас":fmt(x[3],x[4]);
return '<button class="f" data-i="'+x[0]+'"><span><b>'+x[1]+'</b><span>'+x[2]+'</span></span><span class="dt'+(past?" past":"")+'">'+dt+'</span></button>';}).join("");
document.querySelectorAll(".f").forEach(function(b){b.onclick=function(){open("map.html"+(b.getAttribute("data-i")?"#"+b.getAttribute("data-i"):""))};});}
document.getElementById("app").onclick=function(){open("https://festivalplus.info/podat-zayavku")};
document.getElementById("fb").onclick=function(){
if(W&&W.request)W.request("feedback").then(function(a){
var u=null;try{var r=JSON.parse(a.result);if(r&&r.url)u=r.url;}catch(e){}
if(u)open(u);else location.href="mailto:support@festivalplus.info";
},function(){location.href="mailto:support@festivalplus.info";});
else location.href="mailto:support@festivalplus.info";};
rd();
if(W){if(W.onEvent)W.onEvent("themeChanged",function(){at(W.themeParams)});
if(W.ready)W.ready();}
</script>
