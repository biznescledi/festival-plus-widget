<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
background: var(--tg-theme-bg-color);
color: var(--tg-theme-text-color);
padding: 12px;
max-width: 400px;
}
.header { text-align: center; margin-bottom: 12px; }
.logo { margin-bottom: 6px; }
.logo svg { width: 110px; height: auto; display: block; margin: 0 auto; }
.title { font-size: 1.15em; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--tg-theme-hint-color); font-size: 0.85em; }
.free-badge { display: inline-block; background: #34c759; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 600; margin-top: 6px; }
.card { background: var(--tg-theme-secondary-bg-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.card-title { font-size: 0.85em; color: var(--tg-theme-hint-color); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--tg-theme-secondary-bg-color); }
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 0.9em; color: var(--tg-theme-hint-color); }
.info-value { font-size: 0.9em; font-weight: 500; }
.program-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
.program-item:last-child { margin-bottom: 0; }
.time { color: var(--tg-theme-link-color); font-weight: 600; font-size: 0.9em; min-width: 55px; padding-top: 2px; }
.desc { font-size: 0.9em; line-height: 1.3; }
.btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.action-btn { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; border-radius: 10px; padding: 12px; font-size: 1em; font-weight: 500; cursor: pointer; text-align: center; }
.action-btn:active { opacity: 0.8; }
.action-btn.secondary { background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color); }
.status { text-align: center; font-size: 0.8em; color: var(--tg-theme-hint-color); margin-top: 8px; min-height: 18px; }
</style>

<div class="title" id="festivalName">Festival Plus</div>
<div class="subtitle" id="festivalDate">Загрузка...</div>
<span class="free-badge">Вход бесплатный</span>
</div>
<div class="card">
<div class="card-title">📅 Дата и время</div>
<div class="info-row"><span class="info-label">Дата</span><span class="info-value" id="date">—</span></div>
<div class="info-row"><span class="info-label">Время</span><span class="info-value" id="time">—</span></div>
</div>
<div class="card">
<div class="card-title">📍 Локация</div>
<div class="info-value" id="location">—</div>
</div>
<div class="card">
<div class="card-title">🎤 Программа</div>
<div id="program">
<div style="color:var(--tg-theme-hint-color);font-size:0.9em">Загрузка программы...</div>
</div>
</div>
<div class="btn-group">
<button class="action-btn" id="contactBtn">📞 Связаться с организатором</button>
<button class="action-btn secondary" id="editProgramBtn">✏️ Редактировать программу</button>
</div>
<div class="status" id="status">&nbsp;</div>
<script>
const W = window.TelegramWidget;
const $ = (id) => document.getElementById(id);
let rev = -1;
function renderProgram(items) {
if (!items || !items.length) {
$('program').innerHTML = '<div style="color:var(--tg-theme-hint-color);font-size:0.9em">Программа пока пуста</div>';
return;
}
let html = '';
for (const it of items) {
html += '<div class="program-item"><span class="time">' + it.t + '</span><span class="desc">' + it.d + '</span></div>';
}
$('program').innerHTML = html;
}
function showState(json) {
let s = null; try { s = JSON.parse(json); } catch (e) {}
if (!s || s.r < rev) return false; rev = s.r;
if (s.name) $('#festivalName').textContent = s.name;
if (s.date) { $('#date').textContent = s.date; $('#festivalDate').textContent = s.date; }
if (s.time) $('#time').textContent = s.time;
if (s.location) $('#location').textContent = s.location;
if (s.program) renderProgram(s.program);
return true;
}
function setStatus(txt) { $('#status').textContent = txt || '\u00a0'; }
function ask(data) {
if (!W) return;
setStatus('Отправка...');
W.request(data).then(
(ans) => {
if (ans.result) {
try { const r = JSON.parse(ans.result); if (r.url) { W.openLink(r.url); setStatus(''); return; } } catch (e) {}
setStatus(ans.result);
}
},
(err) => setStatus('Ошибка: ' + err.code)
);
}
$('#contactBtn').addEventListener('click', () => ask('contact'));
$('#editProgramBtn').addEventListener('click', () => ask('edit_program'));
if (W) { W.onEvent('chatDataChanged', () => showState(W.chatData)); showState(W.chatData); W.ready(); }
</script>
